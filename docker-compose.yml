services:
  db:
    image: postgres:16
    environment: { POSTGRES_DB: fitssort, POSTGRES_USER: fitssort, POSTGRES_PASSWORD: fitssort }
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgres://fitssort:fitssort@db:5432/fitssort
      DJANGO_DEBUG: "1"
      CORS_ORIGINS: http://localhost:3000
    command: sh -c "python manage.py migrate && python manage.py seed && gunicorn config.wsgi -b 0.0.0.0:8000"
    ports: ["8000:8000"]
    depends_on: [db]
volumes: { pgdata: {} }
